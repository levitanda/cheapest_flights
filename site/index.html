<!doctype html>
<!-- lang/dir are set again by app.js once the reader's language is known; these
     are the Hebrew defaults so the first paint is already right-to-left. -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>טיסות זולות מישראל</title>
<meta name="description" content="מעקב אחרי מחירי טיסות מישראל: מחירים נמוכים בצורה חריגה וטעויות תמחור, עם קישור ישיר לרכישה.">
<link rel="canonical" href="https://isr-cheap-flight.dalev.click/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="טיסות זולות מישראל">
<meta property="og:title" content="טיסות זולות מישראל">
<meta property="og:description" content="מחירים חריגים בטיסות מתל אביב, נמצאים אוטומטית מסביב לשעון.">
<meta property="og:url" content="https://isr-cheap-flight.dalev.click/">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>✈️</text></svg>">
<link rel="stylesheet" href="styles.css">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "טיסות זולות מישראל",
  "url": "https://isr-cheap-flight.dalev.click/",
  "inLanguage": ["he", "ru", "en"],
  "description": "מעקב אוטומטי אחרי מחירי טיסות מתל אביב, כולל טעויות תמחור."
}
</script>
</head>
<body>
<div class="wrap">

<header class="topbar">
  <div class="grow">
    <h1 id="h1">✈️ טיסות זולות מישראל</h1>
    <p id="tagline">מחירים חריגים בטיסות מתל אביב, נמצאים אוטומטית מסביב לשעון.</p>
  </div>
  <nav class="langs" aria-label="Language">
    <button type="button" data-lang="he" aria-pressed="true">עברית</button>
    <button type="button" data-lang="ru" aria-pressed="false">Русский</button>
    <button type="button" data-lang="en" aria-pressed="false">English</button>
  </nav>
</header>

<div class="meta" id="meta">…</div>

<div class="stats" id="stats"></div>

<div class="controls">
  <input id="q" type="search" list="places" autocomplete="off" spellcheck="false"
         placeholder="חיפוש לפי עיר או קוד שדה תעופה…">
  <datalist id="places"></datalist>
  <select id="country" aria-label="country"></select>
  <select id="sort" aria-label="sort"></select>
  <select id="tier" aria-label="tier"></select>
  <label class="toggle"><input type="checkbox" id="direct"><span id="direct-label">ללא עצירות בלבד</span></label>
</div>

<div class="controls secondary">
  <label class="field"><span id="from-label"></span><input id="from" type="date"></label>
  <label class="field"><span id="to-label"></span><input id="to" type="date"></label>
  <label class="field grow">
    <span><span id="budget-label"></span> <b id="budget-value" class="tnum"></b></span>
    <input id="budget" type="range" min="0" max="1000" step="25" value="1000">
  </label>
  <button type="button" id="reset" class="ghost"></button>
</div>

<div id="deals"><div class="loading">…</div></div>

<h2 id="current-head">הזול ביותר כרגע</h2>
<p class="hint" id="current-hint"></p>
<div id="current" class="grid"></div>

<section id="focus" hidden>
  <h2 id="focus-head"></h2>
  <div class="panel">
    <div id="month-chart"></div>
    <h3 id="history-head"></h3>
    <div id="history-chart"></div>
    <p class="hint" id="history-note"></p>
  </div>
</section>

<h2 id="heatmap-head"></h2>
<p class="hint" id="heatmap-hint"></p>
<div class="scroll"><div id="heatmap"></div></div>

<h2 id="routes-head">מסלולים במעקב</h2>
<div class="scroll"><table id="routes"><tbody></tbody></table></div>

<footer>
  <p id="footer-text"></p>
  <p><a id="source-link" href="https://github.com/levitanda/cheapest_flights">קוד פתוח</a></p>
</footer>

</div>

<script src="i18n.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
