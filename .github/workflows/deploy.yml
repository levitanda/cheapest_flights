name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes in quick succession would otherwise race each other's
# update-function-code calls. Queue rather than cancel.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  FUNCTION_NAME: flight-radar-scan
  SITE_BUCKET: isr-cheap-flight-site-654654296346
  STATE_BUCKET: flight-radar-state-654654296346
  DISTRIBUTION_ID: EWANFAR53TRLY
  SCHEDULE_RULE: flight-radar-schedule

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  site:
    # Independent of the scanner deploy: the page is static, so a bad function
    # build must not freeze the site, and vice versa.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are not set"
            echo "See the Deployment section of README.md."
            exit 1
          fi

      - name: Upload site
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          aws s3 cp site/index.html "s3://$SITE_BUCKET/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=300"
          # index.html only. data/deals.json belongs to the scanner, and
          # overwriting it here would wipe the latest findings.
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/index.html" "/" >/dev/null
          echo "site deployed and CDN invalidated"

  scanner:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check credentials
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are not set"
            exit 1
          fi

      - name: Build deployment package
        run: bash deploy/build_lambda.sh

      - name: Update function code
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://dist/flight-radar-lambda.zip \
            --publish >/dev/null
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          echo "function code updated"

      - name: Sync configuration from repository secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
          STATE_BUCKET: ${{ env.STATE_BUCKET }}
          # Secrets
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          # Non-secret tuning, set as repository *variables*
          CURRENCY: ${{ vars.CURRENCY }}
          USD_RATE: ${{ vars.USD_RATE }}
          BASELINE_WINDOW_DAYS: ${{ vars.BASELINE_WINDOW_DAYS }}
          MIN_OBSERVATIONS: ${{ vars.MIN_OBSERVATIONS }}
          MIN_DISTINCT_DAYS: ${{ vars.MIN_DISTINCT_DAYS }}
          MIN_DROP_PCT: ${{ vars.MIN_DROP_PCT }}
          MIN_Z_SCORE: ${{ vars.MIN_Z_SCORE }}
          COLD_START_RATIO: ${{ vars.COLD_START_RATIO }}
          ERROR_FARE_DROP_PCT: ${{ vars.ERROR_FARE_DROP_PCT }}
          ALERT_COOLDOWN_HOURS: ${{ vars.ALERT_COOLDOWN_HOURS }}
          ALERT_IMPROVE_PCT: ${{ vars.ALERT_IMPROVE_PCT }}
          MAX_ALERTS_PER_SCAN: ${{ vars.MAX_ALERTS_PER_SCAN }}
          KEEP_HISTORY_DAYS: ${{ vars.KEEP_HISTORY_DAYS }}
        run: python deploy/sync_lambda_env.py

      # No `if:` guard here on purpose. The `secrets` context is not available
      # in step conditions — referencing it fails the whole workflow at parse
      # time, before any job starts. It is also unnecessary: the sync step
      # above aborts the job when the token is missing, so reaching this point
      # already means there is one.
      - name: Enable the schedule
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          # Only once a token exists — an enabled schedule without one would
          # just fail eight times a day.
          state=$(aws events describe-rule --name "$SCHEDULE_RULE" --query State --output text)
          if [ "$state" != "ENABLED" ]; then
            aws events enable-rule --name "$SCHEDULE_RULE"
            echo "schedule enabled"
          else
            echo "schedule already enabled"
          fi

      - name: Verify the new code actually loads
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          # update-function-code succeeds even when the package cannot be
          # imported, so a deploy that reports success can still leave a
          # function that fails on every schedule tick. Invoke once and reject
          # the import-time failures.
          aws lambda invoke --function-name "$FUNCTION_NAME" \
            --payload '{"source":"deploy-verify"}' --cli-binary-format raw-in-base64-out \
            /tmp/out.json >/tmp/meta.json
          cat /tmp/out.json; echo
          if grep -qE 'Runtime.ImportModuleError|Unable to import module|SyntaxError' /tmp/out.json; then
            echo "::error::the deployed package does not import"
            exit 1
          fi
          echo "package imports cleanly"
