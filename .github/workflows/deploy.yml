name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes in quick succession would otherwise race each other's
# update-function-code calls. Queue rather than cancel.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  FUNCTION_NAME: flight-radar-scan
  SITE_BUCKET: isr-cheap-flight-site-654654296346
  DISTRIBUTION_ID: EWANFAR53TRLY

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  site:
    # Independent of the scanner deploy: the page is static, so a bad function
    # build must not freeze the site, and vice versa.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are not set"
            echo "See the Deployment section of README.md."
            exit 1
          fi

      - name: Upload site
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          aws s3 cp site/index.html "s3://$SITE_BUCKET/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=300"
          # index.html only. data/deals.json belongs to the scanner, and
          # overwriting it here would wipe the latest findings.
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/index.html" "/" >/dev/null
          echo "site deployed and CDN invalidated"

  scanner:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check credentials
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are not set"
            exit 1
          fi

      - name: Build deployment package
        run: bash deploy/build_lambda.sh

      - name: Update function code
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://dist/flight-radar-lambda.zip \
            --publish >/dev/null
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          echo "function code updated"

      - name: Verify the new code actually loads
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          # update-function-code succeeds even when the package cannot be
          # imported, so a deploy that reports success can still leave a
          # function that fails on every schedule tick. Invoke once and reject
          # the import-time failures.
          aws lambda invoke --function-name "$FUNCTION_NAME" \
            --payload '{"source":"deploy-verify"}' --cli-binary-format raw-in-base64-out \
            /tmp/out.json >/tmp/meta.json
          cat /tmp/out.json; echo
          if grep -qE 'Runtime.ImportModuleError|Unable to import module|SyntaxError' /tmp/out.json; then
            echo "::error::the deployed package does not import"
            exit 1
          fi
          echo "package imports cleanly"
