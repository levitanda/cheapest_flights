name: CI

# Pushes to main are covered by the test job in deploy.yml, so this only
# guards pull requests — no point running the suite twice per merge.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
