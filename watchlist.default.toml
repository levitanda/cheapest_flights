# Baked into the Lambda package. Editing this file and redeploying is how the
# watchlist changes — there is no writable disk on the function to edit.
#
# Budget note: `discover` costs one API call, `track` costs one per month.
# This list is 2 + 12 = 14 calls per invocation.

[defaults]
max_nights = 21

# The broad sweep. `discover` only answers for destinations with a cached
# cheapest fare — from TLV that was 29 of them, with no Amsterdam, London or
# Barcelona. `latest` returns the raw recent finds instead, for the same one
# request.
[[watch]]
origin = "TLV"
mode = "latest"

# Kept alongside: the two endpoints do not return identical sets, and the
# union is better coverage than either.
[[watch]]
origin = "TLV"
mode = "discover"
min_nights = 2

# Ramon (VDA) is deliberately absent: the Travelpayouts directory marks it
# "not flightable", so sweeping it only produces an HTTP 400 every run.

[[watch]]
origin = "TLV"
destination = "BKK"
months_ahead = 4
min_nights = 10

[[watch]]
origin = "TLV"
destination = "JFK"
months_ahead = 4

[[watch]]
origin = "TLV"
destination = "ATH"
months_ahead = 4
max_nights = 10
